apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinelx-ingress
  namespace: sentinelx
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "sentinelx-svc"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: sentinelx.corp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentinelx-svc
                port:
                  number: 80
  tls:
    - hosts:
        - sentinelx.corp.local
      secretName: sentinelx-tls-certs
